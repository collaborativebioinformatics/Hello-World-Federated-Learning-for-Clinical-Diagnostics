<script id="demo-logic">
/* The patient query, as scripts/hospital_query.py does it. Same numbers in, same call out. */
var HQ = (function () {
  'use strict';
  var D = null;  // the current disease area's data
  var MISSENSE = 'missense';
  var PRESUMED_HARMFUL = {
    protein_cutting: 'it cuts the protein short',
    frameshift: 'it shifts the reading frame, which scrambles the rest of the protein',
    splice_site: 'it breaks a splice site, so the pieces of the gene are joined wrongly'
  };
  var PRESUMED_HARMLESS = {
    synonymous: 'it is a silent change, the protein stays the same',
    intronic: 'it sits inside an intron, outside the code for the protein'
  };
  var rows = [], byId = {}, primaryByName = {}, primaries = [], overviews = {};

  function load(data) {
    D = data;
    var zeros = [];
    for (var z = 0; z < 2 * data.sites.length; z++) zeros.push(0);
    rows = data.rows.map(function (r, index) {
      var counts = r[7] || zeros, totals = r[8] || null, carried = 0;
      for (var i = 0; i < counts.length; i++) carried += counts[i];
      var name = r[1];
      return { index: index, id: r[0], name: name, nameLower: name.toLowerCase(), gene: geneOf(name),
               type: data.types[r[2]], verdict: data.verdicts[r[3]], stars: r[4], publicFrequency: r[5],
               judgedBy: r[6], counts: counts, totals: totals, said: r[9] || null, carried: carried };
    });
    byId = {}; primaryByName = {}; primaries = []; overviews = {};
    rows.forEach(function (row) {
      byId[row.id] = row;
      // A name can belong to more than one DNA change: keep the one patients carry most, as resolve() does.
      var current = primaryByName[row.name];
      if (!current || row.carried > current.carried) primaryByName[row.name] = row;
    });
    rows.forEach(function (row) { if (primaryByName[row.name] === row) primaries.push(row); });
    primaries.sort(function (a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; });
  }
  function geneOf(name) { var cut = name.indexOf(' '); return cut < 0 ? name : name.slice(0, cut); }

  // ---- number formatting that matches Python's format() and round() ----
  function pyFixed(y, digits) {
    // Python rounds an exact tie to the even digit; toFixed rounds it up. A tie exists only when
    // y * 2^(digits+1) is an odd integer, and that product is exact in floating point.
    var scaled = y * Math.pow(2, digits + 1);
    if (isFinite(scaled) && Math.floor(scaled) === scaled && Math.abs(scaled) % 2 === 1) {
      var s = y * Math.pow(10, digits);  // an exact half-integer
      var low = Math.floor(s);
      var chosen = (low % 2 === 0) ? low : low + 1;
      return (chosen / Math.pow(10, digits)).toFixed(digits);
    }
    return y.toFixed(digits);
  }
  function pyPercent(x, digits) { return pyFixed(x * 100, digits) + '%'; }
  function pyRound(x) {
    var f = Math.floor(x), d = x - f;
    if (d > 0.5) return f + 1;
    if (d < 0.5) return f;
    return f % 2 === 0 ? f : f + 1;
  }
  function thousands(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  // ---- inside one hospital ----
  function reported(carriers, total, minCount) {
    var hidden = carriers > 0 && carriers < minCount;
    return { carriers: hidden ? null : carriers, total: total, hiddenBelow: minCount, hidden: hidden,
             frequency: hidden ? 0 : carriers / total };
  }
  function countText(c) {
    if (c.hidden) return 'fewer than ' + c.hiddenBelow;
    if (!c.carriers) return 'none of ' + thousands(c.total);
    return thousands(c.carriers) + ' of ' + thousands(c.total) + ' (' + pyPercent(c.frequency, 2) + ')';
  }
  function askHospital(row, i, minCount) {
    var site = D.sites[i];
    var healthyTotal = row.totals ? row.totals[2 * i] : site.healthy_total;
    var sickTotal = row.totals ? row.totals[2 * i + 1] : site.sick_total;
    var judged = (row.judgedBy >> i) & 1;
    return { site: site.id, healthy: reported(row.counts[2 * i], healthyTotal, minCount),
             sick: reported(row.counts[2 * i + 1], sickTotal, minCount),
             verdict: judged ? row.verdict : null, stars: judged ? row.stars : null };
  }
  function sameClassCounts(gene, type, minCount) {
    // For a change that cuts the protein, shifts the frame or breaks a splice site: carriers of ANY such change in the gene.
    if (!PRESUMED_HARMFUL[type] || !D.same_class || !D.same_class.genes[gene]) return [];
    var sums = D.same_class.genes[gene], out = [];
    D.sites.forEach(function (site) {
      var row = sums[site.id];
      if (!row) return;
      out.push({ site: site.id, healthy: reported(row[0], row[1], minCount), sick: reported(row[2], row[3], minCount), verdict: null, stars: null });
    });
    return out;
  }

  // ---- the two rules ----
  function isCommon(a, tooCommon) { return a.healthy.frequency >= tooCommon; }
  function isPilingUp(a, tooCommon) {
    if (a.sick.hidden || !isCommon(a, tooCommon)) return false;
    return a.sick.frequency >= D.rules.pile_up_fold * a.healthy.frequency;
  }
  function fold(a) { return a.sick.frequency / a.healthy.frequency; }
  function article(word) { return 'aeiou'.indexOf(word.charAt(0).toLowerCase()) >= 0 ? 'an' : 'a'; }
  function presumption(type) {
    var kind = type.replace(/_/g, ' ');
    if (PRESUMED_HARMFUL[type]) return 'starts out presumed harmful, as ' + article(kind) + ' ' + kind + ' change: ' + PRESUMED_HARMFUL[type];
    if (PRESUMED_HARMLESS[type]) return 'starts out presumed harmless, as ' + article(kind) + ' ' + kind + ' change: ' + PRESUMED_HARMLESS[type];
    return '';
  }
  function whatDecidesWithoutFrequency(type) {
    if (type === MISSENSE) return ['the scores have to decide', 'the scores must decide'];
    if (PRESUMED_HARMFUL[type]) return ['the presumption from its mutation type stands, harmful', 'presumed harmful from its type'];
    if (PRESUMED_HARMLESS[type]) return ['the presumption from its mutation type stands, harmless', 'presumed harmless from its type'];
    return ['its mutation type gives no presumption, so a lab has to weigh the rest', 'its type gives no presumption'];
  }
  function geneLine(gene) { var g = D.genes[gene]; return g ? g[0] : D.rules.too_common; }
  function lineReason(gene) { var g = D.genes[gene]; return g ? g[1] : ''; }
  function judge(answers, publicFrequency, tooCommon) {
    var piles = [], common = [], i;
    for (i = 0; i < answers.length; i++) if (isPilingUp(answers[i], tooCommon)) piles.push(answers[i]);
    for (i = 0; i < answers.length; i++) if (isCommon(answers[i], tooCommon)) common.push([answers[i].healthy.frequency, 'of healthy patients at ' + answers[i].site]);
    if (publicFrequency >= tooCommon) common.push([publicFrequency, 'of people in the public database']);
    var call = piles.length ? 'KEEP FLAGGED' : common.length ? 'LIKELY HARMLESS' : 'FREQUENCY SAYS NOTHING';
    return { call: call, piles: piles, common: common };
  }
  function readEvidence(answers, publicFrequency, type, tooCommon) {
    var reasons = [], p = presumption(type), i;
    if (p) reasons.push(p);
    var judged = judge(answers, publicFrequency, tooCommon), piles = judged.piles, common = judged.common;
    for (i = 0; i < piles.length; i++) {
      var a = piles[i];
      reasons.push('piles up among the sick at ' + a.site + ': ' + pyPercent(a.sick.frequency, 1) + ' of sick against ' +
                   pyPercent(a.healthy.frequency, 1) + ' of healthy patients (' + pyFixed(fold(a), 0) + ' times as common)');
    }
    for (i = 0; i < common.length; i++) reasons.push('common: ' + pyPercent(common[i][0], 1) + ' ' + common[i][1] + ' carry it');
    if (piles.length) {
      var worst = piles[0];
      for (i = 1; i < piles.length; i++) if (fold(piles[i]) > fold(worst)) worst = piles[i];
      return { call: 'KEEP FLAGGED', reasons: reasons, headline: pyFixed(fold(worst), 0) + 'x more common in sick than healthy at ' + worst.site };
    }
    if (common.length) {
      var top = common[0];
      for (i = 1; i < common.length; i++) if (common[i][0] > top[0] || (common[i][0] === top[0] && common[i][1] > top[1])) top = common[i];
      if (tooCommon >= D.rules.too_common_two_copies) {
        reasons.push('too common among healthy people even for a two-copy disease, where healthy carriers of one copy are expected: over the ' + pyPercent(tooCommon, 0) + ' line');
      } else {
        reasons.push('too common among healthy people to cause ' + D.disease_words);
      }
      return { call: 'LIKELY HARMLESS', reasons: reasons, headline: pyPercent(top[0], 1) + ' ' + top[1] + ' carry it' };
    }
    for (i = 0; i < answers.length; i++) {
      var s = answers[i];
      if (s.sick.carriers && s.healthy.carriers === 0) reasons.push('seen in ' + s.sick.carriers + ' sick patients at ' + s.site + ' and in no healthy ones');
    }
    var decides = whatDecidesWithoutFrequency(type);
    // In a two-copy gene a variant can be well above 0.1% and still under its 1% line: say so, rather than "rare".
    var underLine = [];
    for (i = 0; i < answers.length; i++) {
      var f = answers[i].healthy.frequency;
      if (f >= D.rules.too_common && f < tooCommon) underLine.push([f, 'of healthy patients at ' + answers[i].site]);
    }
    if (publicFrequency >= D.rules.too_common && publicFrequency < tooCommon) underLine.push([publicFrequency, 'of people in the public database']);
    if (underLine.length) {
      var seen = underLine[0];
      for (i = 1; i < underLine.length; i++) if (underLine[i][0] > seen[0] || (underLine[i][0] === seen[0] && underLine[i][1] > seen[1])) seen = underLine[i];
      reasons.push('seen in ' + pyPercent(seen[0], 2) + ' ' + seen[1] + ', under the ' + pyPercent(tooCommon, 0) + ' line for a two-copy disease, ' +
                   'so frequency cannot clear it: ' + decides[0]);
      return { call: 'FREQUENCY SAYS NOTHING', reasons: reasons, headline: 'under the ' + pyPercent(tooCommon, 0) + ' line: ' + decides[1] };
    }
    reasons.push('rare or unseen among healthy patients, so frequency cannot clear it: ' + decides[0]);
    return { call: 'FREQUENCY SAYS NOTHING', reasons: reasons, headline: 'rare among healthy patients: ' + decides[1] };
  }

  // ---- the trained model: what it said travels with the page (a probability as a word, and its side of the cut-off), never the scores it read ----
  function modelVerdict(row, minCount) {
    var model = D.model;
    if (row.type !== MISSENSE) return { text: model ? model.missense_only : 'the trained model scores missense changes only, so it is not used here', call: 'not used' };
    var which = D.min_counts.indexOf(minCount), said = row.said;
    if (!model || !said || which < 0) return { text: model ? model.not_scored : 'not scored: no trained model found. Run scripts/03_train_local.py', call: 'not scored' };
    var at = said.length > 2 ? 2 * which : 0, word = said[at], above = said[at + 1] === 1;
    return { text: 'the trained model puts this at ' + word + ' likely harmful, ' + (above ? 'above' : 'below') + ' its cut-off of ' + model.threshold_word + ' · ' + model.trained_words,
             call: above ? 'likely harmful' : 'likely harmless', source: model.source };
  }

  // ---- at the hospital the patient is at ----
  function siteIndex(siteId) {
    for (var i = 0; i < D.sites.length; i++) if (D.sites[i].id === siteId) return i;
    return 0;
  }
  function query(row, patientAt, minCount) {
    var answers = D.sites.map(function (s, i) { return askHospital(row, i, minCount); });
    var own = answers[siteIndex(patientAt)];
    var most = answers[0];
    for (var i = 1; i < answers.length; i++) if (answers[i].healthy.frequency > most.healthy.frequency) most = answers[i];
    var tooCommon = geneLine(row.gene), model = modelVerdict(row, minCount);
    return {
      row: row, name: row.name, variantId: row.id, patientAt: patientAt, publicFrequency: row.publicFrequency,
      answers: answers,
      before: readEvidence([own], row.publicFrequency, row.type, tooCommon),
      after: readEvidence(answers, row.publicFrequency, row.type, tooCommon),
      bestFrequency: most.healthy.frequency,
      bestSite: most.healthy.frequency > 0 ? most.site : null,
      model: model.text, modelCall: model.call,
      mutationType: row.type, presumption: presumption(row.type),
      gene: row.gene, tooCommon: tooCommon, lineReason: lineReason(row.gene),
      sameClass: sameClassCounts(row.gene, row.type, minCount)
    };
  }
  function overview(patientAt, minCount) {
    // The call for every name at once, sorted by name, like hospital_query.overview(). Cached per setting.
    var key = patientAt + '|' + minCount;
    if (overviews[key]) return overviews[key];
    var own = siteIndex(patientAt), byName = {};
    var table = primaries.map(function (row) {
      var answers = D.sites.map(function (s, i) { return askHospital(row, i, minCount); });
      var best = 0, tooCommon = geneLine(row.gene);
      for (var i = 0; i < answers.length; i++) if (answers[i].healthy.frequency > best) best = answers[i].healthy.frequency;
      var before = judge([answers[own]], row.publicFrequency, tooCommon).call;
      var after = judge(answers, row.publicFrequency, tooCommon).call;
      var entry = { row: row, name: row.name, gene: row.gene, type: row.type, before: before, after: after, changed: before !== after, best: best };
      byName[row.name] = entry;
      return entry;
    });
    table.byName = byName;
    var orders = D.orders && D.orders[key];
    table.changedList = orders ? orders.changed.map(function (i) { return byName[rows[i].name]; }).filter(function (e) { return e && e.changed; })
                               : table.filter(function (e) { return e.changed; }).sort(function (a, b) { return b.best - a.best; });
    table.flaggedList = orders ? orders.flagged.map(function (i) { return byName[rows[i].name]; }).filter(function (e) { return e && e.after === 'KEEP FLAGGED'; })
                               : table.filter(function (e) { return e.after === 'KEEP FLAGGED'; }).sort(function (a, b) { return b.best - a.best; });
    overviews[key] = table;
    return table;
  }

  // ---- finding variants ----
  function resolve(text) {
    // A name, in any case, or a variant id. An id in another spelling of the same change is not recognised here.
    var t = text.trim(), lower = t.toLowerCase();
    if (!t) return null;
    if (byId[t]) return byId[t];
    if (D.aliases && D.aliases[t] !== undefined) return rows[D.aliases[t]];
    if (primaryByName[t]) return primaryByName[t];
    for (var i = 0; i < primaries.length; i++) if (primaries[i].nameLower === lower) return primaries[i];
    return null;
  }
  var ANY_GENE = 'any gene', ANY_KIND = 'any kind';
  function filterVariants(table, show, gene, text, kind) {
    // The rows the list should hold, given the three dropdowns and the search box. scripts/06_query_tui.py, filter_variants().
    var out;
    if (text.indexOf('chr') === 0) {
      var found = resolve(text);
      return found ? table.filter(function (t) { return t.name === found.name; }) : [];
    }
    if (show === 'examples' && (text || gene !== ANY_GENE || kind !== ANY_KIND)) show = 'all';
    if (show === 'examples') out = D.examples.map(function (name) { return table.byName[name]; }).filter(Boolean);
    else if (show === 'changed') out = table.changedList;
    else if (show === 'flagged') out = table.flaggedList;
    else out = table;
    if (gene !== ANY_GENE) out = out.filter(function (t) { return t.gene === gene; });
    if (kind !== ANY_KIND) out = out.filter(function (t) { return t.type === kind; });
    if (text) out = out.filter(function (t) { return t.name.toLowerCase().indexOf(text) >= 0; });
    return out;
  }

  return { load: load, data: function () { return D; }, rows: function () { return rows; }, primaries: function () { return primaries; },
           primary: function (name) { return primaryByName[name]; },
           query: query, overview: overview, resolve: resolve, filterVariants: filterVariants, readEvidence: readEvidence,
           askHospital: askHospital, isCommon: isCommon, isPilingUp: isPilingUp, countText: countText, geneOf: geneOf,
           pyPercent: pyPercent, pyFixed: pyFixed, pyRound: pyRound, thousands: thousands, siteIndex: siteIndex,
           MISSENSE: MISSENSE, PRESUMED_HARMFUL: PRESUMED_HARMFUL, ANY_GENE: ANY_GENE, ANY_KIND: ANY_KIND };
})();
</script>

<script id="demo-drawing">
/* How the patient query looks: scripts/query_drawing.py, colour for colour. A "segment" is text with a style. */
var DRAW = (function () {
  'use strict';
  var PATIENT_HERE = '#5fafff', BRIGHT = '#c4c5b5', PLAIN = '#c6c6c6', LABEL = '#949494', FAINT = '#626262', TRACK = '#3a3a3a';
  var GREEN = '#98e024', RED = '#f4005f', YELLOW = '#fd971f', BLACK = '#1a1a1a';
  var CALLS = {
    'LIKELY HARMLESS': { colour: GREEN, label: 'LIKELY HARMLESS', cssClass: 'harmless' },
    'KEEP FLAGGED': { colour: RED, label: 'KEEP FLAGGED', cssClass: 'flagged' },
    'FREQUENCY SAYS NOTHING': { colour: YELLOW, label: 'CANNOT TELL', cssClass: 'cannot-tell' }
  };
  var BORDER = { harmless: '#4ebf71', flagged: '#b93c5b', 'cannot-tell': '#fea62b' };
  var POPULATIONS = { nfe: 'European', sas: 'South Asian', afr: 'African' };
  var MAX_STARS = 4;
  // Glyphs and words per disease area and per mutation type come with the data, from query_drawing.py itself.
  var SCALE_LOW = -5.0, SCALE_HIGH = 0.0, MIN_BAR = 12, MAX_BAR = 44, PERCENT_WIDTH = 7, GAP = 2;
  var help = { keys: [], what_you_see: [] }, areaLabels = {}, mascotData = null;

  function seg(t, fg, bold, bg) { return { t: t, fg: fg || null, bold: !!bold, bg: bg || null }; }
  function width(segs) { var n = 0; segs.forEach(function (s) { n += s.t.length; }); return n; }
  function pad(text, n) { while (text.length < n) text += ' '; return text; }
  function spaces(n) { return new Array(Math.max(0, n) + 1).join(' '); }

  function setup(all) { help = all.help || help; areaLabels = all.area_labels || {}; mascotData = all.mascot || null; }
  function areaLabel(area, title) { return areaLabels[area] || title; }
  function kindGlyph(type) { var g = HQ.data().kind_glyphs; return g && g[type] !== undefined ? g[type] : '?'; }
  function kindLabel(type) { var l = HQ.data().kind_labels; return l && l[type] ? l[type] : type.replace(/_/g, ' '); }

  function chartLayout(chartWidth) {
    var sourceWidth, labWidth, room, compact;
    for (var c = 0; c < 2; c++) {
      compact = c === 1;
      sourceWidth = compact ? 14 : 28; labWidth = compact ? 12 : 17;
      room = chartWidth - (sourceWidth + 2 * PERCENT_WIDTH + labWidth + 5 * GAP);
      if (room >= 2 * MIN_BAR) {
        var bar = Math.min(Math.floor(room / 2), MAX_BAR);
        return { sourceWidth: sourceWidth, labWidth: labWidth, healthyBar: bar, sickBar: bar, compact: compact };
      }
    }
    if (room >= MIN_BAR) return { sourceWidth: sourceWidth, labWidth: labWidth, healthyBar: Math.min(room, MAX_BAR), sickBar: 0, compact: true };
    return { sourceWidth: sourceWidth, labWidth: labWidth, healthyBar: 0, sickBar: 0, compact: true };
  }
  function position(frequency, w) {
    if (frequency <= 0) return 0;
    var clamped = Math.min(Math.max(Math.log(frequency) / Math.LN10, SCALE_LOW), SCALE_HIGH);
    return HQ.pyRound((clamped - SCALE_LOW) / (SCALE_HIGH - SCALE_LOW) * w);
  }
  function bar(frequency, colour, w, tooCommon) {
    if (w === 0) return [];
    if (frequency === null) return [seg('┄┄┄', LABEL), seg(new Array(w - 3 + 1).join(' '))];
    var filled = position(frequency, w), tick = position(tooCommon, w), out = [];
    for (var i = 0; i < w; i++) {
      if (i === tick) out.push(i < filled ? seg('┃', BRIGHT, true) : seg('┃', LABEL));
      else if (i < filled) out.push(seg('━', colour));
      else out.push(seg('─', TRACK));
    }
    return out;
  }
  function lineLabel(tooCommon) { return tooCommon < 0.01 ? HQ.pyPercent(tooCommon, 1) : HQ.pyPercent(tooCommon, 0); }
  function axis(w, tooCommon) {
    if (w === 0) return [];
    var tickLabel = '┃' + lineLabel(tooCommon), tick = position(tooCommon, w), cells = [];
    for (var i = 0; i < w; i++) cells.push(' ');
    for (var k = 0; k < tickLabel.length; k++) cells[tick + k] = tickLabel[k];
    if (tick >= 5) { cells[0] = 'r'; cells[1] = 'a'; cells[2] = 'r'; cells[3] = 'e'; }
    if (w - (tick + tickLabel.length) >= 8) { var word = 'common'; for (var j = 0; j < 6; j++) cells[w - 6 + j] = word[j]; }
    return [seg(cells.slice(0, w).join(''), LABEL)];
  }
  function percent(frequency) {
    if (frequency === 0) return '0';
    if (frequency >= 0.01) return HQ.pyPercent(frequency, 1);
    return frequency >= 0.0001 ? HQ.pyPercent(frequency, 2) : HQ.pyPercent(frequency, 3);
  }
  function short(site) {
    var s = site.replace(/^site_/, '');
    return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
  }
  function hospitalWords(siteId) {
    var site = HQ.data().sites[HQ.siteIndex(siteId)];
    return short(siteId) + ' · ' + (POPULATIONS[site.population] || site.population) + ' · ' + HQ.thousands(site.patients) + ' patients';
  }
  function withShortNames(sentence, sites) {
    sites.forEach(function (site) { sentence = sentence.split(site).join(short(site)); });
    return sentence;
  }
  function emphasiseNumbers(sentence) {
    var out = [], re = /\d[\d.,]*(?:%|x)/g, last = 0, m;
    while ((m = re.exec(sentence)) !== null) {
      if (m.index > last) out.push(seg(sentence.slice(last, m.index), PLAIN));
      out.push(seg(m[0], BRIGHT, true));

    S.minCount = D.rules.min_count;
    if (wanted.at && sites.indexOf(wanted.at) >= 0) S.patientAt = wanted.at;
    if (wanted.min !== undefined && !isNaN(parseInt(wanted.min, 10)) && parseInt(wanted.min, 10) >= 0) S.minCount = parseInt(wanted.min, 10);
    if (wanted.v) { S.typed = wanted.v; S.cursor = S.typed.length; searchAsYouType(); } else refreshList();
    render();

    screen.addEventListener('mousedown', function (e) {
      var cell = cellAt(e.clientX, e.clientY);
      if (!cell) return;
      e.preventDefault();
      click(cell.row, cell.col);
      render(); writeHash();
      kb.focus({ preventScroll: true });
    });
    screen.addEventListener('wheel', function (e) {
      var cell = cellAt(e.clientX, e.clientY);
      if (!cell) return;
      var before = JSON.stringify([S.scroll, S.overlay && S.overlay.scroll]);
      wheel(cell.row, cell.col, e.deltaY > 0 ? 1 : -1);
      if (JSON.stringify([S.scroll, S.overlay && S.overlay.scroll]) !== before) { e.preventDefault(); render(); }
    }, { passive: false });
    kb.addEventListener('keydown', onKeydown);
    kb.addEventListener('input', onInput);
    document.addEventListener('keydown', function (e) { if (e.target !== kb) onKeydown(e); });
    window.addEventListener('resize', placeKeyboard);
    kb.focus({ preventScroll: true });
    setInterval(function () {
      if (S.focus === 'input' && !S.overlay && !S.help) { S.cursorOn = !S.cursorOn; render(); }
      else if (!S.cursorOn) { S.cursorOn = true; }
    }, 500);
    if (DRAW.mascot()) {
      // Tally's clock, as the terminal's set_interval: one tick, and a redraw only when the frame changed
      setInterval(function () {
        if (S.mascotHold !== null) return;
        S.mascotSince++;
        if (S.mascotShown && mascotKey(S.mascotSince) !== S.mascotDrawn) render();
      }, 1000 / DRAW.mascot().fps);
    }
  }
  function boot() {
    screen = document.getElementById('screen');
    kb = document.getElementById('kb');
    var el = document.getElementById('demo-data');
    if (el.type === 'application/json') { start(JSON.parse(el.textContent)); return; }
    if (typeof DecompressionStream === 'undefined') {
      screen.innerHTML = '<div id="note">This browser cannot unpack the data inside the page (it has no DecompressionStream). ' +
                         'Open it in a current Chrome, Edge, Firefox or Safari.</div>';
      return;
    }
    var binary = atob(el.textContent.replace(/\s+/g, '')), bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    new Response(stream).text().then(function (text) { start(JSON.parse(text)); }).catch(function (err) {
      screen.innerHTML = '<div id="note">The data inside the page could not be unpacked: ' + String(err) + '</div>';
    });
  }

  // For checks: drive the screen the way a Textual pilot does, and read the grid back.
  return {
    boot: boot, start: start, press: function (key, shift) { press(key, shift); render(); }, state: function () { return S; },
    grid: function () { draw(); return grid.map(function (row) { return row.map(function (c) { return [c.ch, c.fg, c.bg, c.bold]; }); }); },
    setValue: function (text) { S.typed = text; S.cursor = S.cursorAtEnd ? text.length : Math.min(S.cursor, text.length); searchAsYouType(); render(); },
    setSelect: function (which, value) { setSelectValue(which, value); render(); },
    focus: function (which) { S.focus = which; S.overlay = null; render(); },
    click: function (row, col) { click(row, col); render(); },
    cursorDown: function (n) { for (var i = 0; i < n; i++) moveHighlight(1); render(); },
    cursorOn: function (on) { S.cursorOn = on; render(); },
    mascotHold: function (since) {
      // Pin Tally at this many ticks after a query, as the terminal's hold_mascot(); null lets it move again.
      S.mascotHold = since;
      if (since !== null) S.mascotSince = since;
      render();
    },
    reset: function () {
      if (S.area !== ALL.default_area) loadArea(ALL.default_area);
      S.show = 'examples'; S.gene = HQ.ANY_GENE; S.kind = HQ.ANY_KIND; S.text = ''; S.typed = ''; S.cursor = 0; S.cursorAtEnd = true;
      S.patientAt = sites[0]; S.minCount = D.rules.min_count; S.highlighted = null; S.scroll = 0; S.focus = 'input';
      S.overlay = null; S.help = false; S.result = null; S.travelled = null; S.cursorOn = true;
      refreshList(); render();
    },
    render: render
  };
})();
document.addEventListener('DOMContentLoaded', TERM.boot);
</script>
</body>

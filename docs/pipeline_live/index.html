<meta name="color-scheme" content="dark">
<title>Pipeline in motion</title>

<style>
  :root{--bg:#1e1e1e;--panel:#262626;--ink:#e6e6e6;--ink2:#c6c6c6;--g58:#8a8a8a;--g39:#626262;--g23:#303030;--edge:#4a4a4a;--edge-hot:#9a9a9a;

  text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .ico{stroke:var(--ink);stroke-width:1.4;fill:var(--panel);stroke-linejoin:round;stroke-linecap:round}
  .ico .soft{stroke:var(--g58)}
  .name{font-size:13px;fill:var(--ink);text-anchor:middle}
  .small{font-size:12px;fill:var(--g58);text-anchor:middle}
  .wm{font-size:14px;font-weight:600;fill:#fff;letter-spacing:.01em}
  .wm.wm-s{font-size:12px}
  a .wm:hover{fill:var(--blue);text-decoration:underline}
  .ver{font-size:10.5px;fill:var(--g58)}
  .phone .ver{font-size:9.5px}
  .hero{font-size:44px;font-weight:600;fill:var(--ink);text-anchor:middle}
  .hero .bad{fill:var(--red)}.hero .ok{fill:var(--green)}.hero .to{fill:var(--g58);font-weight:400}
  .hnum{font-size:22px;font-weight:600;fill:var(--ink);text-anchor:middle}
  .qlab{font-size:12px;fill:var(--ink);text-anchor:middle}
  .edge{fill:none;stroke:var(--edge);stroke-width:3;stroke-linecap:round;transition:stroke .3s}
  .edge.hot{stroke:var(--edge-hot)}
  .edge.dashed{stroke-dasharray:5 7;stroke-width:2}
  .edge.arc{stroke-dasharray:2 6;stroke-width:2}
  .edge.here{stroke:var(--blue)}
  .edge.hidden{display:none}
  .ring{fill:none;stroke:var(--ink);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
  .pulse .ring{animation:ring 1.1s ease-out infinite}
  @keyframes ring{0%{opacity:.7;transform:scale(.85)}100%{opacity:0;transform:scale(1.4)}}
  .accent{fill:none;stroke:var(--ink);stroke-width:2;opacity:0;transition:opacity .25s}
  .lit .accent{opacity:1}
  .lit.here .accent{stroke:var(--blue)}
  .token{font-size:12px;fill:#fff;paint-order:stroke;stroke:var(--bg);stroke-width:4px}
  .badge{font-size:13px;font-weight:700;text-anchor:middle}
  .flip{transform-box:fill-box;transform-origin:center;animation:flip .45s ease-out}
  @keyframes flip{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
  .fade{transition:opacity .3s}
  .caption{font-size:14px;color:var(--ink);text-align:center;margin:0;min-height:1.4em;line-height:1.4}
  .stepper{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 22px;align-items:flex-end;position:relative}
  .stepper button{font:inherit;font-size:13px;color:var(--g58);background:none;border:0;padding:4px 0 0;cursor:pointer;line-height:1.4;position:relative}
  .stepper button b{font-weight:600;color:var(--g58);margin-right:5px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .stepper button:hover,.stepper button.on{color:#fff}
  .stepper button.on b{color:#fff}
  .stepper button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .stepper .track{display:block;height:2px;background:var(--g23);margin-top:5px;border-radius:1px;overflow:hidden}
  .stepper .fill{display:block;height:100%;width:0;background:var(--ink)}
  .paused{position:absolute;right:0;top:4px;font-size:12px;color:var(--orange);display:none}
  .paused.on{display:inline}
  .hint{font-size:11.5px;color:var(--g39);text-align:center;margin:0;min-height:1.3em;transition:opacity 1.5s}
  .hint .kbd{color:var(--g58)}
  .hint.gone{opacity:0}
  .foot{font-size:11.5px;color:var(--g58);margin:0;text-align:center;line-height:1.5}
  .foot a{color:var(--g58)}
  .foot a.on{color:#fff;text-decoration:none}
  .tip{position:absolute;z-index:5;pointer-events:none;display:none;max-width:320px;background:var(--panel);border:1px solid var(--edge);border-radius:4px;padding:7px 10px;font-size:12px;line-height:1.5;color:var(--ink2);box-sizing:border-box}
  .tip b{font-weight:600;color:#fff}
  .tip .mono{color:var(--g58)}
  .sr{position:absolute;left:-9999px}
  .still .fade,.still .accent,.still .edge{transition:none}
  .still .flip,.still .pulse .ring{animation:none}
  .still .pulse .ring{opacity:.5}
  @media (max-width:719px){.stepper{gap:4px 14px}.stepper button{font-size:12px}.paused{position:static;width:100%;text-align:center}}
  @media (prefers-reduced-motion:reduce){.pulse .ring{animation:none}.flip{animation:none}}
</style>
</head>

    },
  };
  SITES.forEach(site => { TIPS[site] = () => { const h = A().hospitals.sites[site], r = A().results, o = A().other_types; if (!h) return '<b>' + site + '</b><br>not built'; return '<b>' + site + '</b>, ' + esc(h.population_word) + ' ancestry, simulated<br>' + n(h.patients) + ' patients, counts among healthy and sick for every variant<br>' + n(h.verdicts) + ' verdicts: ' + n(h.pathogenic) + ' harmful, ' + n(h.benign) + ' harmless' + (r.built && r.per_site[site] ? '<br>Own model: ' + r.weights + ' numbers, cut-off ' + pct(r.per_site[site].threshold) : '') + (o && o.lab_spelling ? '<br>Its lab writes insertions and deletions ' + esc(o.lab_spelling[site]) : ''); }; });
  function showTip(id, ev) { if (!TIPS[id]) return; tip.innerHTML = TIPS[id](); tip.dataset.node = id; tip.style.display = 'block'; moveTip(ev); }
  function moveTip(ev) {
    const r = stage.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, w = tip.offsetWidth, hgt = tip.offsetHeight;
    tip.style.left = clamp(x + 14, 0, Math.max(0, r.width - w)) + 'px'; tip.style.top = clamp(y + 16, 0, Math.max(0, r.height - hgt)) + 'px';
  }
  function hideTip() { tip.style.display = 'none'; tip.dataset.node = ''; }

  // ------------------------------------------------------------------ small painters
  function setHero(text, label) { el('hero').innerHTML = text; el('hero-lab').textContent = label || ''; }
  function lit(id, on, here) { const g = stage.querySelector('[data-node="' + id + '"]'); if (g) { g.classList.toggle('lit', !!on); g.classList.toggle('here', !!(on && here)); } }
  function pulse(id, on) { const g = stage.querySelector('[data-node="' + id + '"]'); if (g) g.classList.toggle('pulse', !!on); }
  function setNum(site, v) { const e = el('num-' + site); if (e) e.textContent = n(v); }
  function setBar(site, patients, dur) {
    const h = A().hospitals, maxP = Math.max(1, ...SITES.map(s => (h.sites[s] || {}).patients || 0)), b = el('bar-' + site); if (!b) return;
    const w = 16 + 70 * (patients / maxP);
    b.style.transition = dur && !reduced ? 'width ' + dur + 'ms ease, x ' + dur + 'ms ease' : 'none';
    b.setAttribute('x', -w / 2); b.setAttribute('width', w);
  }
  function paintDial() {
    const rp = replay(), hand = el('dial-hand'), qt = el('dial-q');
    const qi = ui.q < 0 ? (rp ? rp.quarters.length - 1 : 3) : ui.q, to = 90 * qi;
    if (reduced || Math.abs(to - dialAngle) < 1) hand.setAttribute('transform', 'rotate(' + to + ')');
    else tweens.push({ e: hand, from: dialAngle, to: to < dialAngle ? to + 360 : to, t0: clock.t, dur: 600, set: v => hand.setAttribute('transform', 'rotate(' + (v % 360).toFixed(1) + ')') });
    dialAngle = to;
    qt.textContent = rp ? rp.quarters[qi].quarter : '';
  }
  function paintDoctorEdge() { SITES.forEach(s => { const p = path('d_' + s); p.classList.toggle('hidden', s !== ui.site); p.classList.toggle('here', s === ui.site); }); }
  function setBadge(call, who, flip) {
    const g = el('badge-g'), f = el('badge-f'), r = el('badge-r'), t = el('badge-t');
    if (!call) { g.setAttribute('opacity', 0); return; }
    const [word, bg, fg] = CALL[call] || [call, '#303030', '#fff'];
    t.textContent = word; t.setAttribute('fill', fg); r.setAttribute('fill', bg);
    const w = word.length * 8.4 + 22; r.setAttribute('x', -w / 2); r.setAttribute('width', w);
    el('badge-who').textContent = who || '';
    g.setAttribute('opacity', 1); f.classList.remove('flip'); if (flip && !reduced) { void f.getBoundingClientRect(); f.classList.add('flip'); }
  }
  function setBubble(text) { const g = el('bubble'); if (!text) { g.setAttribute('opacity', 0); return; } el('bubble-t').textContent = text; g.setAttribute('opacity', 1); }
  function setSwitch(show, on) { const g = el('sw'); if (!show) { g.setAttribute('opacity', 0); return; } el('sw-icon').innerHTML = ICON.sw(on); g.setAttribute('opacity', 1); }
  function caption(html) { $('#caption').innerHTML = html; $('#live').textContent = $('#caption').textContent; }

  // ------------------------------------------------------------------ the clock, flights and tweens
  const clock = { t: 0, playing: !reduced, speed: 1, last: null, fixed: false };
  const flights = [], tweens = [], waiters = [];
  const ease = p => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);
  function makeDot(f) {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    const c = document.createElementNS('http://www.w3.org/2000/svg', f.kind === 'weights' ? 'rect' : 'circle');
    if (f.kind === 'weights') { c.setAttribute('x', -6); c.setAttribute('y', -6); c.setAttribute('width', 12); c.setAttribute('height', 12); c.setAttribute('rx', 2); }
    else c.setAttribute('r', f.kind === 'question' ? 7 : f.kind === 'counts' ? 7 : 6);
    c.setAttribute('fill', DOT[f.kind] || DOT.records);
    c.setAttribute('stroke', f.kind === 'question' ? 'var(--blue)' : 'var(--bg)');
    c.setAttribute('stroke-width', f.kind === 'question' ? 2.5 : 1.5);
    g.appendChild(c);
    if (f.label) { const t = document.createElementNS('http://www.w3.org/2000/svg', 'text'); t.setAttribute('class', 'token'); t.setAttribute('x', 11); t.setAttribute('y', 4); t.textContent = f.label; g.appendChild(t); }
    dotsEl.appendChild(g);
    return g;
  }
  function fly(edgeId, o) {
    o = o || {};
    if (!path(edgeId)) return Promise.resolve();
    return new Promise(res => flights.push({ id: edgeId, t0: clock.t + (o.delay || 0), dur: o.dur || 1400, kind: o.kind || EDGE_KIND[edgeId] || 'records', reverse: !!o.reverse, label: o.label || '', res, g: null }));
  }
  function wait(ms) { return new Promise(r => waiters.push({ at: clock.t + ms, r })); }
  function tween(id, from, to, dur, fmt) { const e = el(id); if (e) tweens.push({ e, from, to, t0: clock.t, dur, fmt: fmt || n }); }
  function step() {
    const hot = new Set();
    for (let i = flights.length - 1; i >= 0; i--) {
      const f = flights[i], p = (clock.t - f.t0) / f.dur, pth = path(f.id);
      if (p < 0) continue;
      if (!pth) { if (f.g) f.g.remove(); flights.splice(i, 1); f.res(); continue; }
      if (!f.g) f.g = makeDot(f);
      if (p >= 1) { f.g.remove(); flights.splice(i, 1); f.res(); continue; }
      hot.add(f.id);
      const L = pth.getTotalLength(), e = ease(p), pt = pth.getPointAtLength(L * (f.reverse ? 1 - e : e));
      f.g.setAttribute('transform', 'translate(' + pt.x.toFixed(1) + ',' + pt.y.toFixed(1) + ')');
    }
    EDGES.forEach(e => { const pth = path(e.id); if (pth) pth.classList.toggle('hot', hot.has(e.id)); });
    for (let i = tweens.length - 1; i >= 0; i--) {
      const t = tweens[i], p = clamp((clock.t - t.t0) / t.dur, 0, 1), v = t.from + (t.to - t.from) * ease(p);
      if (t.set) t.set(v); else t.e.textContent = t.fmt(v);
      if (p >= 1) tweens.splice(i, 1);
    }
    for (let i = waiters.length - 1; i >= 0; i--) if (clock.t >= waiters[i].at) { const w = waiters.splice(i, 1)[0]; w.r(); }
    paintProgress();
  }
  function frame(now) {
    if (clock.last == null) clock.last = now;
    const dt = Math.min(100, now - clock.last);
    clock.last = now;
    if (clock.playing && !clock.fixed) clock.t += dt * clock.speed;
    step();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ------------------------------------------------------------------ one story on the doctor's screen
  async function playStory(alive, key, site, withFix) {
    const r = resultOf(key, site, withFix);
    if (!r) return;
    ui.story = key; ui.site = site; ui.fix = withFix;
    const st = STATE.stories.find(s => s.key === key), hasSwitch = !!(st && st.no_fix);
    setBadge(null); el('model-line').textContent = ''; paintDoctorEdge();
    lit('doctor', true); lit(site, false);
    setSwitch(hasSwitch, withFix);
    const shortName = r.name.length > 16 ? r.gene + ' deletion' : r.name;
    caption(hasSwitch ? 'A doctor at ' + SITE_NAME[site] + ' asks about the ' + esc(shortName) + ', spelling fix ' + (withFix ? 'on' : 'off') : 'A doctor at ' + SITE_NAME[site] + ' asks about ' + esc(r.name));
    setBubble(shortName);
    await wait(700); if (!alive()) return;
    await fly('d_' + site, { kind: 'question', dur: 1000 }); if (!alive()) return;
    setBadge(r.before.call, SITE_NAME[site] + ' alone');
    lit(site, true, true);
    await wait(600); if (!alive()) return;
    const others = SITES.filter(s => s !== site), label0 = r.name.length > 16 ? r.gene + ' del' : r.name;
    await Promise.all(others.map((o, i) => { const arc = arcBetween(site, o); return fly(arc.id, { kind: 'question', reverse: arc.reverse, label: label0, delay: i * 300, dur: 1400 }); })); if (!alive()) return;
    await Promise.all(others.map((o, i) => {
      const arc = arcBetween(o, site), a = r.answers.find(x => x.site === o);
      const label = a.healthy.hidden ? '<' + a.healthy.hidden_below : a.healthy.carriers ? n(a.healthy.carriers) + ' of ' + n(a.healthy.total) : 'none';
      return fly(arc.id, { kind: 'counts', reverse: arc.reverse, label, delay: i * 300, dur: 1400 });
    })); if (!alive()) return;
    await fly('d_' + site, { kind: 'counts', reverse: true, dur: 800 }); if (!alive()) return;
    setBadge(r.after.call, 'all 3 hospitals', true);
    caption(esc(siteWords(r.after.headline)));
    await wait(800); if (!alive()) return;
    if (r.model_probability != null) {
      await fly('server_doctor', { kind: 'weights', dur: 800 }); if (!alive()) return;
      el('model-line').textContent = 'model ' + pct(r.model_probability, r.model_probability < 0.01 ? 1 : 0) + ' harmful';
    }
    await wait(2200); if (!alive()) return;
    lit(site, false);
  }

  // ------------------------------------------------------------------ the four scenes
  const SCENES = [
    { title: 'Data comes in', dur: 7400, async run(alive) {
        const t = A().table;
        caption('Public data in, dealt to three hospitals');
        setHero(n(t.rows), 'variants');
        lit('table', true);
        for (let w = 0; w < 3; w++) { ['panelapp_table', 'myvariant_table', 'genome_table'].forEach((e, i) => fly(e, { delay: i * 180, dur: 1300 })); await wait(700); if (!alive()) return; }
        await wait(900); if (!alive()) return;
        lit('table', false);
        for (let w = 0; w < 3; w++) {
          SITES.forEach((s, i) => fly('table_' + s, { delay: i * 150, dur: 1500 }));
          if (w === 0) fly('table_padlock', { dur: 1200 });
          await wait(800); if (!alive()) return;
        }
        await wait(2000); if (!alive()) return;
      } },
    { title: 'Hospitals train together', dur: 9200, async run(alive) {
        const r = A().results, s = STATE.federated_settings, R = s.rounds || 20;
        caption('Patient records never leave the hospital');
        setHero(r.built ? String(r.weights) : '–', 'numbers travel per hospital');
        lit('server', true);
        for (const round of [1, 2, R]) {
          el('round').textContent = 'round ' + round + ' of ' + R;
          SITES.forEach(x => pulse(x, true));
          await wait(500); if (!alive()) return;
          SITES.forEach(x => pulse(x, false));
          await Promise.all(SITES.map((x, i) => fly('w_' + x, { kind: 'weights', delay: i * 140, dur: 800 }))); if (!alive()) return;
          pulse('server', true); await wait(300); if (!alive()) return; pulse('server', false);
          await Promise.all(SITES.map((x, i) => fly('w_' + x, { kind: 'weights', reverse: true, delay: i * 140, dur: 800 }))); if (!alive()) return;
        }
        el('round').textContent = '';
        lit('padlock', true); await fly('server_padlock', { kind: 'weights', dur: 800 }); if (!alive()) return;
        el('tick-padlock').setAttribute('opacity', 1); await wait(500); if (!alive()) return;
        await fly('server_doctor', { kind: 'weights', dur: 1000 }); if (!alive()) return;
        await wait(700); if (!alive()) return;
        el('tick-padlock').setAttribute('opacity', 0); lit('padlock', false); lit('server', false);
      } },
    { title: 'A quarter passes', dur: 12600, async run(alive) {
        const rp = replay();
        caption('Each quarter: retrain, check, release' + (rp && rp.placeholder ? ' <span class="mono" style="color:var(--g58)">· placeholder</span>' : ''));
        if (!rp) { setHero('–', 'no replay for this area'); await wait(3000); return; }
        lit('dial', true);
        let prev = null;
        for (let qi = 0; qi < rp.quarters.length; qi++) {
          const q = rp.quarters[qi], m = q.model;
          ui.q = qi; paintDial();
          SITES.forEach(s => { const to = q.per_site[s]; if (!to) return; if (prev && prev.per_site[s]) tween('num-' + s, prev.per_site[s].patients, to.patients, 800); else setNum(s, to.patients); setBar(s, to.patients, prev ? 800 : 0); });
          const pm = prev && prev.model && prev.model.false_alarms ? prev.model.false_alarms : null;
          if (m && m.false_alarms) {
            setHero('<tspan class="bad" id="hero-a">' + (pm ? pm.public : m.false_alarms.public) + '</tspan><tspan class="to"> → </tspan><tspan class="ok" id="hero-b">' + (pm ? pm.federated : m.false_alarms.federated) + '</tspan>', 'false alarms, public → hospitals');
            if (pm) { tween('hero-a', pm.public, m.false_alarms.public, 800, v => String(Math.round(v))); tween('hero-b', pm.federated, m.false_alarms.federated, 800, v => String(Math.round(v))); }
          } else setHero('–', 'not measured this quarter');
          SITES.forEach(x => pulse(x, true));
          await Promise.all(SITES.map((x, i) => fly('w_' + x, { kind: 'weights', delay: i * 100, dur: 650 }))); if (!alive()) return;
          SITES.forEach(x => pulse(x, false));
          await Promise.all(SITES.map((x, i) => fly('w_' + x, { kind: 'weights', reverse: true, delay: i * 100, dur: 650 }))); if (!alive()) return;
          await fly('server_padlock', { kind: 'weights', dur: 550 }); if (!alive()) return;
          el('tick-padlock').setAttribute('opacity', 1);
          await fly('server_doctor', { kind: 'weights', dur: 650 }); if (!alive()) return;
          el('tick-padlock').setAttribute('opacity', 0);
          prev = q;
          await wait(250); if (!alive()) return;
        }
        await wait(1100); if (!alive()) return;
        lit('dial', false); ui.q = -1; paintDial();
      } },
    { title: 'A doctor asks', dur: 40000, async run(alive) {
        setHero('', '');
        if (!isHeart() || !STATE.stories.length || STATE.stories.every(s => s.error)) { caption('The three stories are heart variants'); await wait(3000); return; }
        // the three stories, one after another, all for a patient at Oslo; the deletion first without the spelling fix, then with it
        for (const st of STATE.stories) {
          if (st.error) continue;
          if (st.no_fix) { await playStory(alive, st.key, 'site_oslo', false); if (!alive()) return; await wait(300); if (!alive()) return; }
          await playStory(alive, st.key, 'site_oslo', true); if (!alive()) return;
          setBadge(null); setBubble(null); el('model-line').textContent = ''; setSwitch(false);
          await wait(400); if (!alive()) return;
        }
        lit('doctor', false);
      } },
  ];
  function resetScene() {
    flights.splice(0).forEach(f => { if (f.g) f.g.remove(); f.res(); });
    tweens.splice(0);
    SITES.forEach(s => { pulse(s, false); lit(s, false); const hs = A().hospitals.sites[s]; if (hs) { setNum(s, hs.patients); setBar(s, hs.patients, 0); } });
    ['panelapp', 'table', 'padlock', 'server', 'dial', 'doctor'].forEach(id => lit(id, false));
    pulse('server', false); el('round').textContent = ''; el('tick-padlock').setAttribute('opacity', 0);
    setBadge(null); setBubble(null); setSwitch(false); el('model-line').textContent = '';
    ui.q = -1; ui.story = null; ui.fix = true; paintDial();
  }
  let sceneId = 0, sceneStart = 0;
  async function loop() {
    for (;;) {
      const my = ++sceneId, s = ui.scene;
      resetScene(); sceneStart = clock.t; paintStepper();
      await SCENES[s].run(() => my === sceneId);
      if (my === sceneId) ui.scene = (s + 1) % SCENES.length;
      await wait(150);
    }
  }
  function jump(i) {
    ui.scene = (i + SCENES.length) % SCENES.length; sceneId++;
    waiters.splice(0).forEach(w => w.r());
    flights.splice(0).forEach(f => { if (f.g) f.g.remove(); f.res(); });
    if (!clock.playing) setPlay(true);
  }

  // ------------------------------------------------------------------ the stepper, the only chrome
  const stepper = $('#stepper');
  function paintStepper() {
    stepper.innerHTML = SCENES.map((s, i) => '<button type="button" data-scene="' + i + '" class="' + (ui.scene === i ? 'on' : '') + '" title="play scene ' + (i + 1) + ', ' + esc(s.title.toLowerCase()) + '"><b>' + (i + 1) + '</b>' + esc(s.title) + '<span class="track"><span class="fill" id="fill-' + i + '"></span></span></button>').join('') + '<span class="paused' + (clock.playing ? '' : ' on') + '" id="paused" title="click the picture or press space to resume">paused</span>';
  }
  let lastFill = -1;
  function paintProgress() {
    const f = el('fill-' + ui.scene); if (!f) return;
    const p = clamp((clock.t - sceneStart) / SCENES[ui.scene].dur, 0, 1), w = Math.round(p * 200) / 2;
    if (w !== lastFill) { f.style.width = w + '%'; lastFill = w; }
  }
  stepper.addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return; jump(+b.dataset.scene); paintStepper(); });
  function setPlay(on) { clock.playing = on; const p = el('paused'); if (p) p.classList.toggle('on', !on); }
  stage.addEventListener('click', ev => { if (ev.target.closest('a')) return; setPlay(!clock.playing); });
  document.addEventListener('keydown', ev => {
    if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
    const tag = (ev.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select' || tag === 'button' && ev.key === ' ') return;
    if (ev.key === ' ') { ev.preventDefault(); setPlay(!clock.playing); }
    else if (ev.key === 'ArrowRight') { ev.preventDefault(); jump(ui.scene + 1); paintStepper(); }
    else if (ev.key === 'ArrowLeft') { ev.preventDefault(); jump(ui.scene - 1); paintStepper(); }
    else if (ev.key === 'r' || ev.key === 'R') { jump(0); paintStepper(); }
  });
  let resizeTimer = null;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { const phone = stage.clientWidth < 720; if (phone !== ui.phone) { build(); jump(ui.scene); } else fit(); }, 120); });
  // the room the picture has changes when the lines under it wrap or fonts arrive: keep it fitted
  if (window.ResizeObserver) new ResizeObserver(() => fit()).observe(stage);
  window.addEventListener('load', fit);

  // ------------------------------------------------------------------ the hint and the footer
  $('#hint').innerHTML = '<span class="kbd">space</span> pause or resume · <span class="kbd">← →</span> previous or next scene · <span class="kbd">R</span> restart · click the picture to pause · hover a picture for its numbers';
  setTimeout(() => $('#hint').classList.add('gone'), 10000);
  function setArea(a) { if (a === ui.area) return; ui.area = a; ui.q = -1; build(); jump(ui.scene); }
  function paintFoot() {
    const built = (STATE.built_on || '').slice(0, 10);
    const areas = AREAS.map(a => '<a href="#' + a + '" data-area="' + a + '" class="' + (a === ui.area ? 'on' : '') + '" title="show the ' + esc(STATE.areas[a].label) + ' build: ' + n(STATE.areas[a].table.rows) + ' variants">' + esc(AREA_GLYPH[a] || '') + ' ' + esc(AREA_WORD[a] || STATE.areas[a].label) + '</a>').join(' · ');
    $('#foot').innerHTML = areas + ' &nbsp;·&nbsp; <span title="Real: every expert verdict, prediction score and population frequency, the gene lists from NHS-approved panels, the reference genome, the trained weights and every number the model was checked with. Simulated: the three hospitals, every patient and carrier count, which hospital holds which verdict, a public database covering Europeans only, and the quarterly replay, where the pooled fit stands in for NVFlare. Counts among sick patients come from the known verdict and prove nothing about a variant. Nothing is generated at run time. Rebuild: ' + esc(STATE.rebuild) + '">Simulated hospitals, real public data · rebuilt ' + esc(built) + '</span>' + (STATE.repo ? ' · <a href="' + esc(STATE.repo) + '" title="the code and the docs">repository</a>' : '') + (STATE.demo_url ? ' · <a href="' + esc(STATE.demo_url) + '" title="the patient query, live in the browser">query demo</a>' : '');
  }
  $('#foot').addEventListener('click', ev => { const a = ev.target.closest('a[data-area]'); if (!a) return; ev.preventDefault(); setArea(a.dataset.area); });

  // ------------------------------------------------------------------ first paint
  // ?scene=N opens on a scene; &pause=MS steps the clock to that moment and freezes it, for a still of a scene
  const want = /[?&]scene=(\d)/.exec(location.search), hold = /[?&]pause=(\d+)/.exec(location.search);
  if (want) ui.scene = clamp(+want[1], 0, SCENES.length - 1);
  build();
  loop();
  if (hold) {
    clock.fixed = true;
    document.body.classList.add('still');
    (async () => {
      const end = +hold[1];
      while (clock.t < end) { clock.t += 16.7 * clock.speed; step(); for (let hop = 0; hop < 6; hop++) await Promise.resolve(); }
      setPlay(false);
    })();
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<!--
  The pipeline as built, as a picture that plays itself, drawn in the colours of the patient query screen
  (docs/patient_query_tui.png, scripts/query_drawing.py): near-black ground, off-white ink, green for harmless,
  orange for cannot tell, red for keep flagged, blue for the patient's hospital. Four scenes loop: data comes in,
  hospitals train together, a quarter passes, a doctor asks. The only control is the stepper at the bottom;
  a click on the picture pauses. Every explanation is a hover tooltip; every number is in the JSON block at the end,
  computed by scripts/export_pipeline_state.py from the repository on __BUILT__.
  Do not edit index.html by hand: rerun  uv run python scripts/export_pipeline_state.py  instead.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Pipeline in motion</title>
<meta name="description" content="Team 12's federated pipeline as a moving picture: public data dealt to three simulated hospitals, weights travelling to an NVFlare server and back, a quarter passing, and a doctor's question answered with counts.">
<style>
  :root{--bg:#1e1e1e;--panel:#262626;--ink:#e6e6e6;--ink2:#c6c6c6;--g58:#8a8a8a;--g39:#626262;--g23:#303030;--edge:#4a4a4a;--edge-hot:#9a9a9a;
        --blue:#5fafff;--green:#7ed321;--orange:#f5a623;--red:#e55353;--nvidia:#76B900;
        --oslo:#7aa6c2;--karachi:#d9a066;--lagos:#8fbf7f}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink2);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px;display:flex;flex-direction:column;min-height:100%;box-sizing:border-box;padding:10px 16px 10px;gap:6px}
  .stage{flex:1 1 auto;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .stage svg{display:block;width:100%;height:100%;max-width:100%}
  .mono,text.mono,.hnum,.hero,.ver,.token,.badge,.qlab,.kbd{font-family:ui-monospace,Menlo,Consolas,"Cascadia Mono",monospace;font-variant-numeric:tabular-nums}
  text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .ico{stroke:var(--ink);stroke-width:1.4;fill:var(--panel);stroke-linejoin:round;stroke-linecap:round}
  .ico .soft{stroke:var(--g58)}
  .name{font-size:13px;fill:var(--ink);text-anchor:middle}
  .small{font-size:12px;fill:var(--g58);text-anchor:middle}
  .wm{font-size:14px;font-weight:600;fill:#fff;letter-spacing:.01em}
  .wm.wm-s{font-size:12px}
  a .wm:hover{fill:var(--blue);text-decoration:underline}
  .ver{font-size:10.5px;fill:var(--g58)}
  .phone .ver{font-size:9.5px}
  .hero{font-size:44px;font-weight:600;fill:var(--ink);text-anchor:middle}
  .hero .bad{fill:var(--red)}.hero .ok{fill:var(--green)}.hero .to{fill:var(--g58);font-weight:400}
  .hnum{font-size:22px;font-weight:600;fill:var(--ink);text-anchor:middle}
  .qlab{font-size:12px;fill:var(--ink);text-anchor:middle}
  .edge{fill:none;stroke:var(--edge);stroke-width:3;stroke-linecap:round;transition:stroke .3s}
  .edge.hot{stroke:var(--edge-hot)}
  .edge.dashed{stroke-dasharray:5 7;stroke-width:2}
  .edge.arc{stroke-dasharray:2 6;stroke-width:2}
  .edge.here{stroke:var(--blue)}
  .edge.hidden{display:none}
  .ring{fill:none;stroke:var(--ink);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
  .pulse .ring{animation:ring 1.1s ease-out infinite}
  @keyframes ring{0%{opacity:.7;transform:scale(.85)}100%{opacity:0;transform:scale(1.4)}}
  .accent{fill:none;stroke:var(--ink);stroke-width:2;opacity:0;transition:opacity .25s}
  .lit .accent{opacity:1}
  .lit.here .accent{stroke:var(--blue)}
  .token{font-size:12px;fill:#fff;paint-order:stroke;stroke:var(--bg);stroke-width:4px}
  .badge{font-size:13px;font-weight:700;text-anchor:middle}
  .flip{transform-box:fill-box;transform-origin:center;animation:flip .45s ease-out}
  @keyframes flip{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
  .fade{transition:opacity .3s}
  .caption{font-size:14px;color:var(--ink);text-align:center;margin:0;min-height:1.4em;line-height:1.4}
  .stepper{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 22px;align-items:flex-end;position:relative}
  .stepper button{font:inherit;font-size:13px;color:var(--g58);background:none;border:0;padding:4px 0 0;cursor:pointer;line-height:1.4;position:relative}
  .stepper button b{font-weight:600;color:var(--g58);margin-right:5px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .stepper button:hover,.stepper button.on{color:#fff}
  .stepper button.on b{color:#fff}
  .stepper button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .stepper .track{display:block;height:2px;background:var(--g23);margin-top:5px;border-radius:1px;overflow:hidden}
  .stepper .fill{display:block;height:100%;width:0;background:var(--ink)}
  .paused{position:absolute;right:0;top:4px;font-size:12px;color:var(--orange);display:none}
  .paused.on{display:inline}
  .hint{font-size:11.5px;color:var(--g39);text-align:center;margin:0;min-height:1.3em;transition:opacity 1.5s}
  .hint .kbd{color:var(--g58)}
  .hint.gone{opacity:0}
  .foot{font-size:11.5px;color:var(--g58);margin:0;text-align:center;line-height:1.5}
  .foot a{color:var(--g58)}
  .foot a.on{color:#fff;text-decoration:none}
  .tip{position:absolute;z-index:5;pointer-events:none;display:none;max-width:320px;background:var(--panel);border:1px solid var(--edge);border-radius:4px;padding:7px 10px;font-size:12px;line-height:1.5;color:var(--ink2);box-sizing:border-box}
  .tip b{font-weight:600;color:#fff}
  .tip .mono{color:var(--g58)}
  .sr{position:absolute;left:-9999px}
  .still .fade,.still .accent,.still .edge{transition:none}
  .still .flip,.still .pulse .ring{animation:none}
  .still .pulse .ring{opacity:.5}
  @media (max-width:719px){.stepper{gap:4px 14px}.stepper button{font-size:12px}.paused{position:static;width:100%;text-align:center}}
  @media (prefers-reduced-motion:reduce){.pulse .ring{animation:none}.flip{animation:none}}
</style>
</head>
<body>
<div class="stage" id="stage" title="click to pause or resume"></div>
<p class="caption" id="caption"></p>
<nav class="stepper" id="stepper" aria-label="scenes"></nav>
<p class="hint" id="hint"></p>
<p class="foot" id="foot"></p>
<div class="tip" id="tip"></div>
<p class="sr" id="live" aria-live="polite"></p>
<noscript><p class="foot">This page needs JavaScript. The state it draws from is in the JSON block at the end of the file.</p></noscript>

<script id="state" type="application/json">__STATE_JSON__</script>
<script>
(function () {
  'use strict';
  const STATE = JSON.parse(document.getElementById('state').textContent);
  const $ = s => document.querySelector(s);
  const SITES = ['site_oslo', 'site_karachi', 'site_lagos'];
  const SITE_NAME = { site_oslo: 'Oslo', site_karachi: 'Karachi', site_lagos: 'Lagos' };
  const FLAG = { site_oslo: 'var(--oslo)', site_karachi: 'var(--karachi)', site_lagos: 'var(--lagos)' };
  const CALL = { 'LIKELY HARMLESS': ['LIKELY HARMLESS', '#7ed321', '#1e1e1e'], 'KEEP FLAGGED': ['KEEP FLAGGED', '#e55353', '#ffffff'], 'FREQUENCY SAYS NOTHING': ['CANNOT TELL', '#f5a623', '#1e1e1e'] };
  const AREA_GLYPH = { cardiac: '♥', cancer: '◉', all: '⊕' };
  const AREA_WORD = { cardiac: 'heart', cancer: 'cancer', all: 'all panels' };
  const DOT = { genes: '#8a8a8a', records: '#e6e6e6', letters: '#e6e6e6', weights: '#ffffff', counts: '#ffffff', question: '#1e1e1e' };
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const n = x => (x == null ? '–' : Math.round(x).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','));
  const pct = (x, d) => (x == null ? '–' : (x * 100).toFixed(d || 0) + '%');
  const fix = (x, d) => (x == null ? '–' : Number(x).toFixed(d));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const siteWords = s => s.replace(/site_(oslo|karachi|lagos)/g, (m, x) => SITE_NAME['site_' + x]);

  const AREAS = Object.keys(STATE.areas);
  const ui = { area: STATE.default_area, scene: 0, story: null, site: 'site_oslo', fix: true, phone: false, q: -1 };
  const A = () => STATE.areas[ui.area];
  const replay = () => (STATE.replay.areas || {})[ui.area] || null;
  const isHeart = () => ui.area === STATE.default_area;
  const resultOf = (key, site, withFix) => { const st = STATE.stories.find(s => s.key === key); if (!st || st.error) return null; return (!withFix && st.no_fix ? st.no_fix : st.per_site)[site]; };

  // ------------------------------------------------------------------ where things are, desktop and phone
  const POS = {
    desk: { vb: [1070, 600], hero: [390, 70], panelapp: [150, 150], myvariant: [150, 300], genome: [150, 450], table: [390, 300], padlock: [565, 300],
            site_oslo: [530, 128], site_karachi: [530, 478], site_lagos: [845, 478], server: [700, 300], dial: [970, 128], doctor: [970, 300], badge: [970, 408], bubble: [970, 208], sw: [970, 470] },
    phone: { vb: [480, 820], hero: [378, 66], panelapp: [135, 118], myvariant: [135, 198], genome: [135, 278], table: [378, 180], padlock: [378, 300],
             site_oslo: [80, 445], site_karachi: [240, 445], site_lagos: [400, 445], server: [240, 640], dial: [80, 668], doctor: [400, 680], badge: [400, 772], bubble: [372, 600], sw: [260, 772] },
  };
  const RAD = { table: 52, padlock: 38, site_oslo: 58, site_karachi: 58, site_lagos: 58, server: 58, dial: 46, doctor: 46 };
  const radius = id => RAD[id] || (ui.phone ? 132 : 150);
  const CARD_W = () => (ui.phone ? 250 : 280);
  let P = POS.desk;
  const at = id => P[id];

  // ------------------------------------------------------------------ the pictograms, drawn at 0,0, then scaled 1.5
  const ICON = {
    hospital(site) {
      const flag = FLAG[site];
      return '<g class="ico"><rect x="-24" y="-12" width="48" height="36" rx="2"/><rect x="-24" y="-12" width="48" height="9" fill="' + flag + '" fill-opacity=".45" stroke="none"/><path d="M-24 -3h48" class="soft"/>' +
        '<rect x="-8" y="-26" width="16" height="14" rx="1"/><path d="M0 -23v8M-4 -19h8" stroke-width="1.8"/>' +
        '<rect x="-18" y="3" width="7" height="7" fill="' + flag + '" fill-opacity=".55"/><rect x="-3.5" y="3" width="7" height="7" fill="' + flag + '" fill-opacity=".55"/><rect x="11" y="3" width="7" height="7" fill="' + flag + '" fill-opacity=".55"/>' +
        '<rect x="-5" y="14" width="10" height="10" fill="' + flag + '" fill-opacity=".55"/><path d="M-22 -12v-18"/><path d="M-22 -30l12 3-12 3z" fill="' + flag + '" stroke="' + flag + '"/></g>';
    },
    server() {
      return '<g class="ico"><rect x="-24" y="-8" width="48" height="13" rx="2"/><rect x="-24" y="7" width="48" height="13" rx="2" fill="var(--g23)"/><circle cx="-17" cy="-1.5" r="1.7" fill="var(--ink)" stroke="none"/><circle cx="-17" cy="13.5" r="1.7" fill="var(--ink)" stroke="none"/>' +
        '<path d="M-8 -1.5h22M-8 13.5h22" class="soft"/><path d="M19 -8v-19"/><circle cx="19" cy="-28" r="2.8" fill="var(--nvidia)" stroke="none"/><path d="M12 -28a7 7 0 0 1 14 0" fill="none"/><path d="M7 -28a12 12 0 0 1 24 0" fill="none" class="soft"/></g>';
    },
    panels() { return '<g class="ico"><rect x="-12" y="-4" width="34" height="24" rx="2"/><rect x="-18" y="-10" width="34" height="24" rx="2"/><rect x="-24" y="-16" width="34" height="24" rx="2" fill="var(--g23)"/><path d="M-18 -8h20M-18 -3h14M-18 2h18" class="soft"/></g>'; },
    tile() { return '<g class="ico"><rect x="-26" y="-18" width="52" height="36" rx="2"/><path d="M-26 -6h52M-26 6h52M-13 -18v36M0 -18v36M13 -18v36" class="soft"/><rect x="0" y="-6" width="13" height="12" fill="var(--ink)" fill-opacity=".35" stroke="none"/><rect x="13" y="6" width="13" height="12" fill="var(--blue)" fill-opacity=".45" stroke="none"/></g>'; },
    dna() { return '<g class="ico"><path d="M-13 -24C-2 -12 -2 12 -13 24" fill="none"/><path d="M13 -24C2 -12 2 12 13 24" fill="none"/><path d="M-9 -15h18M-4 -5h8M-4 5h8M-9 15h18" class="soft"/></g>'; },
    clipboard() { return '<g class="ico"><rect x="-17" y="-20" width="34" height="42" rx="3"/><rect x="-7" y="-24" width="14" height="8" rx="2" fill="var(--g23)"/><path d="M-9 -6h18M-9 2h18M-9 10h8" class="soft"/><path d="M4 12l3 3 6-7" stroke="var(--green)"/></g>'; },
    dial() { return '<g class="ico"><circle cx="0" cy="0" r="24"/><path d="M0 -24v5M24 0h-5M0 24v-5M-24 0h5"/><circle cx="0" cy="0" r="2" fill="var(--ink)"/></g>'; },
    shield() { return '<g class="ico"><path d="M0 -15L12 -10V-1C12 7 6 12 0 15C-6 12 -12 7 -12 -1V-10Z" stroke="var(--green)"/><path d="M-5 0l4 4 7-8" fill="none" stroke="var(--green)" stroke-width="1.8"/></g>'; },
    padlock() { return '<g class="ico"><path d="M-7 -6v-6a7 7 0 0 1 14 0v6" fill="none"/><rect x="-12" y="-6" width="24" height="18" rx="2" fill="var(--g23)"/><circle cx="0" cy="2" r="2" fill="var(--ink)" stroke="none"/></g>'; },
    sw(on) { return '<g class="ico"><rect x="-19" y="-9" width="38" height="18" rx="9" fill="' + (on ? 'var(--green)' : 'var(--g23)') + '" fill-opacity="' + (on ? '.3' : '1') + '"/><circle id="sw-knob" cx="' + (on ? 10 : -10) + '" cy="0" r="6.5" fill="' + (on ? 'var(--green)' : 'var(--g58)') + '" stroke="none"/></g>'; },
  };

  // ------------------------------------------------------------------ the edges
  const EDGES = [
    { id: 'panelapp_table', from: 'panelapp', to: 'table', kind: 'genes' },
    { id: 'myvariant_table', from: 'myvariant', to: 'table', kind: 'records' },
    { id: 'genome_table', from: 'genome', to: 'table', kind: 'letters' },
    { id: 'table_site_oslo', from: 'table', to: 'site_oslo', kind: 'records' },
    { id: 'table_site_karachi', from: 'table', to: 'site_karachi', kind: 'records' },
    { id: 'table_site_lagos', from: 'table', to: 'site_lagos', kind: 'records', sweep: true },
    { id: 'table_padlock', from: 'table', to: 'padlock', kind: 'records', dashed: true },
    { id: 'w_site_oslo', from: 'site_oslo', to: 'server', kind: 'weights' },
    { id: 'w_site_karachi', from: 'site_karachi', to: 'server', kind: 'weights' },
    { id: 'w_site_lagos', from: 'site_lagos', to: 'server', kind: 'weights' },
    { id: 'server_padlock', from: 'server', to: 'padlock', kind: 'weights', dashed: true },
    { id: 'server_doctor', from: 'server', to: 'doctor', kind: 'weights' },
    { id: 'dial_server', from: 'dial', to: 'server', kind: 'none', dashed: true },
    { id: 'q_site_oslo_site_karachi', from: 'site_oslo', to: 'site_karachi', kind: 'counts', arc: 1 },
    { id: 'q_site_karachi_site_lagos', from: 'site_karachi', to: 'site_lagos', kind: 'counts', arc: 1 },
    { id: 'q_site_oslo_site_lagos', from: 'site_oslo', to: 'site_lagos', kind: 'counts', arc: 1 },
    { id: 'd_site_oslo', from: 'doctor', to: 'site_oslo', kind: 'question', doctor: true },
    { id: 'd_site_karachi', from: 'doctor', to: 'site_karachi', kind: 'question', doctor: true },
    { id: 'd_site_lagos', from: 'doctor', to: 'site_lagos', kind: 'question', doctor: true },
  ];
  const EDGE_KIND = {};
  EDGES.forEach(e => { EDGE_KIND[e.id] = e.kind; });
  function arcBetween(a, b) {
    const e = EDGES.find(x => x.arc && ((x.from === a && x.to === b) || (x.from === b && x.to === a)));
    return { id: e.id, reverse: e.from !== a };
  }
  function trim(a, b, ra, rb) {
    const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1;
    return [[a[0] + dx * ra / L, a[1] + dy * ra / L], [b[0] - dx * rb / L, b[1] - dy * rb / L]];
  }
  function edgePath(e) {
    const a = at(e.from), b = at(e.to), ra = radius(e.from), rb = radius(e.to);
    if (e.arc) {
      const s = at('server'), mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      let vx = mx - s[0], vy = my - s[1]; const L = Math.hypot(vx, vy) || 1; vx /= L; vy /= L;
      const bulge = ui.phone ? 80 : 120, [p, q] = trim(a, b, ra, rb);
      return 'M' + p[0] + ' ' + p[1] + ' Q' + (mx + vx * bulge) + ' ' + (my + vy * bulge) + ' ' + q[0] + ' ' + q[1];
    }
    if (e.sweep && !ui.phone) {
      const [p, q] = trim(a, b, ra, rb);
      return 'M' + p[0] + ' ' + p[1] + ' C' + (p[0] + 90) + ' ' + (p[1] + 250) + ' ' + (q[0] - 130) + ' ' + (q[1] + 90) + ' ' + q[0] + ' ' + q[1];
    }
    const [p, q] = trim(a, b, ra, rb);
    return 'M' + p[0] + ' ' + p[1] + ' L' + q[0] + ' ' + q[1];
  }

  // ------------------------------------------------------------------ the picture
  function svgMarkup() {
    const [W, H] = P.vb, h = A().hospitals, maxP = Math.max(1, ...SITES.map(s => (h.sites[s] || {}).patients || 0));
    let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="The pipeline: public sources feed one variant table, dealt to three simulated hospitals that train together through an NVFlare server; a quarter dial; a doctor asks the hospitals for counts">';
    s += '<g id="edges">' + EDGES.map(e => '<path id="e-' + e.id + '" class="edge' + (e.dashed ? ' dashed' : '') + (e.arc ? ' arc' : '') + (e.doctor ? ' hidden' : '') + '" d="' + edgePath(e) + '"/>').join('') + '</g>';
    const node = (id, icon, name, extra, r) => { const [x, y] = at(id); return '<g class="node" data-node="' + id + '" transform="translate(' + x + ' ' + y + ')"><circle class="ring" r="' + (r || 50) + '"/><circle class="accent" r="' + (r || 50) + '"/><g transform="scale(1.5)">' + icon + '</g>' + (name ? '<text class="name" y="62">' + esc(name) + '</text>' : '') + (extra || '') + '</g>'; };
    // a source card in the still picture's box style: the name set as a wordmark and linked, the version underneath
    const mark = (key, big) => { const src = STATE.sources[key] || { name: key }; return '<a href="' + esc(src.url || '#') + '" target="_blank" rel="noopener"><text class="wm' + (big && !ui.phone ? '' : ' wm-s') + '">' + esc(src.name) + '</text></a>'; };
    const card = (id, icon, rows) => {
      const [x, y] = at(id), w = CARD_W(), hh = rows.length > 1 ? 36 : 30;
      let g = '<g class="node" data-node="' + id + '" transform="translate(' + x + ' ' + y + ')"><circle class="ring" r="36"/><rect class="accent" x="' + (-w / 2 - 3) + '" y="' + (-hh - 3) + '" width="' + (w + 6) + '" height="' + (hh * 2 + 6) + '" rx="8"/><rect x="' + (-w / 2) + '" y="' + (-hh) + '" width="' + w + '" height="' + (hh * 2) + '" rx="6" fill="var(--panel)" stroke="var(--edge)" stroke-width="1.5"/>';
      g += '<g transform="translate(' + (-w / 2 + 26) + ' 0) scale(.75)">' + icon + '</g>';
      const x0 = -w / 2 + 52, first = STATE.sources[rows[0][0]] || {}, cw = ui.phone ? 7.4 : 9;
      if (rows.length === 1 && rows[0].length === 1) {
        g += '<g transform="translate(' + x0 + ' -3)">' + mark(rows[0][0], true) + '</g><text class="ver" x="' + x0 + '" y="14">' + esc(first.version || '') + '</text>';
      } else if (rows.length === 1) {
        rows[0].forEach((k, i) => { const src = STATE.sources[k] || {}; g += '<g transform="translate(' + x0 + ' ' + (-8 + i * 24) + ')">' + mark(k, true) + '</g><text class="ver" x="' + (x0 + src.name.length * cw + 2) + '" y="' + (-8 + i * 24) + '">' + esc(src.version || '') + '</text>'; });
      } else {
        g += '<g transform="translate(' + x0 + ' -13)">' + mark(rows[0][0], true) + '</g><text class="ver" x="' + (x0 + first.name.length * (cw - 0.6) + 2) + '" y="-13">' + esc(first.version || '') + '</text>';
        let cx = x0;
        rows[1].forEach(k => { const src = STATE.sources[k] || { name: k }; g += '<g transform="translate(' + cx + ' 8)">' + mark(k, false) + '</g><text class="ver" x="' + cx + '" y="22">' + esc(src.version || '') + '</text>'; cx += Math.max(50, src.name.length * 7.6, String(src.version || '').length * 6.3); });
      }
      return g + '</g>';
    };
    s += card('panelapp', ICON.panels(), [['panelapp']]);
    s += card('myvariant', ICON.tile(), [['myvariant'], ['clinvar', 'dbnsfp', 'gnomad']]);
    s += card('genome', ICON.dna(), [['ucsc', 'ensembl']]);
    s += node('table', ICON.tile(), 'variant table', '', 50);
    s += node('padlock', ICON.padlock(), 'test set', '<path id="tick-padlock" class="fade" d="M-9 3l6 6 12-13" fill="none" stroke="var(--green)" stroke-width="3" opacity="0"/>', 40);
    SITES.forEach(site => {

          await fly('server_padlock', { kind: 'weights', dur: 550 }); if (!alive()) return;
          el('tick-padlock').setAttribute('opacity', 1);
          await fly('server_doctor', { kind: 'weights', dur: 650 }); if (!alive()) return;
          el('tick-padlock').setAttribute('opacity', 0);
          prev = q;
          await wait(250); if (!alive()) return;
        }
        await wait(1100); if (!alive()) return;
        lit('dial', false); ui.q = -1; paintDial();
      } },
    { title: 'A doctor asks', dur: 40000, async run(alive) {
        setHero('', '');
        if (!isHeart() || !STATE.stories.length || STATE.stories.every(s => s.error)) { caption('The three stories are heart variants'); await wait(3000); return; }
        // the three stories, one after another, all for a patient at Oslo; the deletion first without the spelling fix, then with it
        for (const st of STATE.stories) {
          if (st.error) continue;
          if (st.no_fix) { await playStory(alive, st.key, 'site_oslo', false); if (!alive()) return; await wait(300); if (!alive()) return; }
          await playStory(alive, st.key, 'site_oslo', true); if (!alive()) return;
          setBadge(null); setBubble(null); el('model-line').textContent = ''; setSwitch(false);
          await wait(400); if (!alive()) return;
        }
        lit('doctor', false);
      } },
  ];
  function resetScene() {
    flights.splice(0).forEach(f => { if (f.g) f.g.remove(); f.res(); });
    tweens.splice(0);
    SITES.forEach(s => { pulse(s, false); lit(s, false); const hs = A().hospitals.sites[s]; if (hs) { setNum(s, hs.patients); setBar(s, hs.patients, 0); } });
    ['panelapp', 'table', 'padlock', 'server', 'dial', 'doctor'].forEach(id => lit(id, false));
    pulse('server', false); el('round').textContent = ''; el('tick-padlock').setAttribute('opacity', 0);
    setBadge(null); setBubble(null); setSwitch(false); el('model-line').textContent = '';
    ui.q = -1; ui.story = null; ui.fix = true; paintDial();
  }
  let sceneId = 0, sceneStart = 0;
  async function loop() {
    for (;;) {
      const my = ++sceneId, s = ui.scene;
      resetScene(); sceneStart = clock.t; paintStepper();
      await SCENES[s].run(() => my === sceneId);
      if (my === sceneId) ui.scene = (s + 1) % SCENES.length;
      await wait(150);
    }
  }
  function jump(i) {
    ui.scene = (i + SCENES.length) % SCENES.length; sceneId++;
    waiters.splice(0).forEach(w => w.r());
    flights.splice(0).forEach(f => { if (f.g) f.g.remove(); f.res(); });
    if (!clock.playing) setPlay(true);
  }

  // ------------------------------------------------------------------ the stepper, the only chrome
  const stepper = $('#stepper');
  function paintStepper() {
    stepper.innerHTML = SCENES.map((s, i) => '<button type="button" data-scene="' + i + '" class="' + (ui.scene === i ? 'on' : '') + '" title="play scene ' + (i + 1) + ', ' + esc(s.title.toLowerCase()) + '"><b>' + (i + 1) + '</b>' + esc(s.title) + '<span class="track"><span class="fill" id="fill-' + i + '"></span></span></button>').join('') + '<span class="paused' + (clock.playing ? '' : ' on') + '" id="paused" title="click the picture or press space to resume">paused</span>';
  }
  let lastFill = -1;
  function paintProgress() {
    const f = el('fill-' + ui.scene); if (!f) return;
    const p = clamp((clock.t - sceneStart) / SCENES[ui.scene].dur, 0, 1), w = Math.round(p * 200) / 2;
    if (w !== lastFill) { f.style.width = w + '%'; lastFill = w; }
  }
  stepper.addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return; jump(+b.dataset.scene); paintStepper(); });
  function setPlay(on) { clock.playing = on; const p = el('paused'); if (p) p.classList.toggle('on', !on); }
  stage.addEventListener('click', ev => { if (ev.target.closest('a')) return; setPlay(!clock.playing); });
  document.addEventListener('keydown', ev => {
    if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
    const tag = (ev.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select' || tag === 'button' && ev.key === ' ') return;
    if (ev.key === ' ') { ev.preventDefault(); setPlay(!clock.playing); }
    else if (ev.key === 'ArrowRight') { ev.preventDefault(); jump(ui.scene + 1); paintStepper(); }
    else if (ev.key === 'ArrowLeft') { ev.preventDefault(); jump(ui.scene - 1); paintStepper(); }
    else if (ev.key === 'r' || ev.key === 'R') { jump(0); paintStepper(); }
  });
  let resizeTimer = null;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { const phone = stage.clientWidth < 720; if (phone !== ui.phone) { build(); jump(ui.scene); } else fit(); }, 120); });
  // the room the picture has changes when the lines under it wrap or fonts arrive: keep it fitted
  if (window.ResizeObserver) new ResizeObserver(() => fit()).observe(stage);
  window.addEventListener('load', fit);

  // ------------------------------------------------------------------ the hint and the footer
  $('#hint').innerHTML = '<span class="kbd">space</span> pause or resume · <span class="kbd">← →</span> previous or next scene · <span class="kbd">R</span> restart · click the picture to pause · hover a picture for its numbers';
  setTimeout(() => $('#hint').classList.add('gone'), 10000);
  function setArea(a) { if (a === ui.area) return; ui.area = a; ui.q = -1; build(); jump(ui.scene); }
  function paintFoot() {
    const built = (STATE.built_on || '').slice(0, 10);
    const areas = AREAS.map(a => '<a href="#' + a + '" data-area="' + a + '" class="' + (a === ui.area ? 'on' : '') + '" title="show the ' + esc(STATE.areas[a].label) + ' build: ' + n(STATE.areas[a].table.rows) + ' variants">' + esc(AREA_GLYPH[a] || '') + ' ' + esc(AREA_WORD[a] || STATE.areas[a].label) + '</a>').join(' · ');
    $('#foot').innerHTML = areas + ' &nbsp;·&nbsp; <span title="Real: every expert verdict, prediction score and population frequency, the gene lists from NHS-approved panels, the reference genome, the trained weights and every number the model was checked with. Simulated: the three hospitals, every patient and carrier count, which hospital holds which verdict, a public database covering Europeans only, and the quarterly replay, where the pooled fit stands in for NVFlare. Counts among sick patients come from the known verdict and prove nothing about a variant. Nothing is generated at run time. Rebuild: ' + esc(STATE.rebuild) + '">Simulated hospitals, real public data · rebuilt ' + esc(built) + '</span>' + (STATE.repo ? ' · <a href="' + esc(STATE.repo) + '" title="the code and the docs">repository</a>' : '') + (STATE.demo_url ? ' · <a href="' + esc(STATE.demo_url) + '" title="the patient query, live in the browser">query demo</a>' : '');
  }
  $('#foot').addEventListener('click', ev => { const a = ev.target.closest('a[data-area]'); if (!a) return; ev.preventDefault(); setArea(a.dataset.area); });

  // ------------------------------------------------------------------ first paint
  // ?scene=N opens on a scene; &pause=MS steps the clock to that moment and freezes it, for a still of a scene
  const want = /[?&]scene=(\d)/.exec(location.search), hold = /[?&]pause=(\d+)/.exec(location.search);
  if (want) ui.scene = clamp(+want[1], 0, SCENES.length - 1);
  build();
  loop();
  if (hold) {
    clock.fixed = true;
    document.body.classList.add('still');
    (async () => {
      const end = +hold[1];
      while (clock.t < end) { clock.t += 16.7 * clock.speed; step(); for (let hop = 0; hop < 6; hop++) await Promise.resolve(); }
      setPlay(false);
    })();
  }
})();
</script>
</body>
